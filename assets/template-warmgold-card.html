<!doctype html>
<html lang="zh-CN" data-system="warm-gold" data-palette="warm-gold-classic">
<head>
  <meta charset="utf-8">
  <title>[必填] 替换为社交卡组标题 · Social Card Set</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* =========================================================
       Warm Gold 暖金中登 — Social Card Seed Template
       ---------------------------------------------------------
       Three boards built in one HTML:
         .poster.xhs      1080×1440  (3:4   小红书)
         .poster.square   1080×1080  (1:1   微信方封面)
         .poster.wide     2100× 900  (21:9  微信主封面)
         .pair-preview                       21:9 + 1:1 配对预览

       System + palette switching via root attributes:
         <html data-system="warm-gold" data-palette="…">
         warm-gold-classic | warm-gold-champagne | warm-gold-bronze
         warm-gold-rose | warm-gold-espresso | warm-gold-noir

       Fill posters where marked <!-- POSTERS_HERE -->.
       Each poster carries one Layout Recipe (G01-G12) from
       references/layout-recipes.md.

       Mixed typography (identity): serif titles + sans body + mono meta.
       Gold is a rule/accent — never a canvas-wide fill (R10).
       Shadows: rgba(122,74,0,…) or rgba(17,9,4,…) only (R11).
       ========================================================= */

    /* ---------- 1. Palette tokens (6 mutually exclusive) ---------- */
    :root,
    [data-system="warm-gold"][data-palette="warm-gold-classic"] {
      --paper: #FBF8F5;
      --paper-2: #FDFBFA;
      --ink: #110904;
      --muted: #4A3625;
      --line: #E2D5CB;
      --accent: #E79F00;
      --accent-deep: #7A4A00;
      --accent-soft: #F4EDE8;
      --input: #ECE2DB;
      --ink-rgb: 17, 9, 4;
      --paper-rgb: 251, 248, 245;
      --accent-rgb: 231, 159, 0;
    }
    [data-system="warm-gold"][data-palette="warm-gold-champagne"] {
      --paper: #FDFAF6;
      --paper-2: #FBF5EE;
      --ink: #1A1208;
      --muted: #5A4630;
      --line: #EAD9C8;
      --accent: #E8B563;
      --accent-deep: #9A6A1E;
      --accent-soft: #F7EFE4;
      --input: #F0E4D6;
      --ink-rgb: 26, 18, 8;
      --paper-rgb: 253, 250, 246;
      --accent-rgb: 232, 181, 99;
    }
    [data-system="warm-gold"][data-palette="warm-gold-bronze"] {
      --paper: #F9F4EC;
      --paper-2: #F5EDE2;
      --ink: #140C05;
      --muted: #4E3A24;
      --line: #DCCBB4;
      --accent: #C18200;
      --accent-deep: #6B4200;
      --accent-soft: #EFE4D2;
      --input: #E8DCC8;
      --ink-rgb: 20, 12, 5;
      --paper-rgb: 249, 244, 236;
      --accent-rgb: 193, 130, 0;
    }
    [data-system="warm-gold"][data-palette="warm-gold-rose"] {
      --paper: #FCF7F4;
      --paper-2: #FAF1EC;
      --ink: #170D0A;
      --muted: #563B33;
      --line: #EBD8D0;
      --accent: #DFA05A;
      --accent-deep: #8A4E28;
      --accent-soft: #F6EBE4;
      --input: #F0E2DA;
      --ink-rgb: 23, 13, 10;
      --paper-rgb: 252, 247, 244;
      --accent-rgb: 223, 160, 90;
    }
    [data-system="warm-gold"][data-palette="warm-gold-espresso"] {
      --paper: #F7F2EA;
      --paper-2: #F1EADD;
      --ink: #0E0805;
      --muted: #453221;
      --line: #D4C3AB;
      --accent: #B8860B;
      --accent-deep: #5C3D00;
      --accent-soft: #EBE0CE;
      --input: #E2D5C0;
      --ink-rgb: 14, 8, 5;
      --paper-rgb: 247, 242, 234;
      --accent-rgb: 184, 134, 11;
    }
    /* warm-gold-noir — the ONLY official dark Warm Gold palette.
       Use for night events, black-tie photography, dark product shots.
       Do not improvise other dark backgrounds. */
    [data-system="warm-gold"][data-palette="warm-gold-noir"] {
      --paper: #14100B;
      --paper-2: #1C1711;
      --ink: #F5EDDF;
      --muted: #A8967A;
      --line: rgba(245,237,223,.18);
      --accent: #E79F00;
      --accent-deep: #C18200;
      --accent-soft: #2A2118;
      --input: #241D15;
      --ink-rgb: 245, 237, 223;
      --paper-rgb: 20, 16, 11;
      --accent-rgb: 231, 159, 0;
    }

    /* ---------- 2. Shared gold tokens (every palette) ---------- */
    :root {
      --gold-deep: #7A4A00;
      --gold-mid:  #C18200;
      --gold:      #E79F00;
      --gold-glow: #B8860B;
      --gold-rule: linear-gradient(135deg, #7A4A00 0%, #C18200 50%, #E79F00 100%);
      --gold-shadow: 0 2px 12px rgba(122,74,0,.18);
      --ink-shadow: 0 2px 8px rgba(17,9,4,.10);
    }

    /* ---------- 3. Typography stack (mixed: serif + sans + mono) ---------- */
    :root {
      --serif-zh: "Noto Serif SC", "Songti SC", "STSong", serif;
      --serif-en: "Playfair Display", "Noto Serif SC", serif;
      --sans-zh: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --sans-en: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono:    "IBM Plex Mono", "Noto Sans SC", ui-monospace, "SF Mono", Consolas, monospace;
    }

    /* ---------- 4. Spacing tokens (Carbon-style 2x scale) ---------- */
    :root {
      --sp-3:   8px;
      --sp-4:  12px;
      --sp-5:  16px;
      --sp-6:  24px;
      --sp-7:  32px;
      --sp-8:  40px;
      --sp-9:  48px;
      --sp-10: 64px;
      --sp-11: 80px;
      --sp-12: 96px;
      --sp-13:160px;
    }

    /* ---------- 5. Reset & sheet ---------- */
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      font-family: var(--sans-zh);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 64px 32px;
    }
    .sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* ---------- 6. Poster boards (fixed export sizes) ---------- */
    .poster {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      isolation: isolate;
    }
    .poster.xhs    { width: 1080px; height: 1440px; }
    .poster.square { width: 1080px; height: 1080px; }
    .poster.wide   { width: 2100px; height:  900px; }
    .poster figure { margin: 0; }

    .poster.xhs    .content { padding: var(--sp-12) var(--sp-11); }
    .poster.square .content { padding: var(--sp-11) var(--sp-11); }
    .poster.wide   .content { padding: var(--sp-11) var(--sp-13); }
    .content { position: relative; width: 100%; height: 100%; z-index: 2; }

    /* ---------- 7. Background layers (grain + gold glow) ----------
       Warm Gold does NOT mount ink-flow WebGL. Atmosphere is CSS:
       warm grain + one radial gold glow behind the focal element. */
    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .10;
      mix-blend-mode: multiply;
      background:
        linear-gradient(112deg, rgba(17,9,4,.03), transparent 28%, rgba(255,255,255,.14) 54%, transparent 84%),
        radial-gradient(circle at 20% 24%, rgba(17,9,4,.04), transparent 40%),
        radial-gradient(rgba(17,9,4,.04) 1px, transparent 1px);
      background-size: auto, auto, 3px 3px;
    }
    .gold-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(42% 34% at var(--gx, 30%) var(--gy, 20%),
        rgba(184,134,11,.22), transparent 70%);
    }
    .paper-wash {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(var(--ink-rgb),.015), rgba(var(--ink-rgb),.04) 60%, rgba(var(--ink-rgb),.07));
    }
    /* warm-gold-noir — flip grain to screen-mode specks, wash to gilt + shadow.
       Light-paper math doesn't carry over. */
    [data-palette="warm-gold-noir"] .grain {
      opacity: .22;
      mix-blend-mode: screen;
      background-image: radial-gradient(rgba(245,237,223,.08) 1px, transparent 1px);
      background-size: 3px 3px;
    }
    [data-palette="warm-gold-noir"] .paper-wash {
      background:
        radial-gradient(70% 50% at 30% 18%, rgba(231,159,0,.10), transparent 62%),
        radial-gradient(60% 55% at 82% 88%, rgba(60,40,16,.28), transparent 70%),
        linear-gradient(180deg, rgba(245,237,223,.02), rgba(0,0,0,.35));
    }
    [data-palette="warm-gold-noir"] .gold-glow {
      background: radial-gradient(42% 34% at var(--gx, 30%) var(--gy, 20%),
        rgba(231,159,0,.20), transparent 70%);
    }

    /* ---------- 8. Typography roles ----------
       Mixed stance: serif titles, sans body, mono meta.
       "The larger, the lighter" still applies within each family. */
    .kicker {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 21px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 18px;
    }
    .h-display {
      font-family: var(--serif-zh);
      font-weight: 500;
      font-size: 116px;
      line-height: 1.08;
      letter-spacing: .02em;
      margin: 0 0 24px;
      color: var(--ink);
    }
    .h-xl {
      font-family: var(--serif-zh);
      font-weight: 500;
      font-size: 80px;
      line-height: 1.12;
      letter-spacing: .01em;
      margin: 0 0 24px;
      color: var(--ink);
    }
    .h-md {
      font-family: var(--serif-zh);
      font-weight: 500;
      font-size: 52px;
      line-height: 1.20;
      margin: 0 0 18px;
      color: var(--ink);
    }
    .h-sub {
      font-family: var(--serif-en);
      font-style: italic;
      font-weight: 400;
      font-size: 34px;
      color: var(--muted);
      margin: 0 0 24px;
    }
    .lead {
      font-family: var(--sans-zh);
      font-weight: 400;
      font-size: 30px;
      line-height: 1.55;
      color: rgba(var(--ink-rgb), .84);
      margin: 0 0 24px;
    }
    .body {
      font-family: var(--sans-zh);
      font-weight: 400;
      font-size: 26px;
      line-height: 1.62;
      color: rgba(var(--ink-rgb), .82);
      margin: 0 0 18px;
    }
    .meta {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .20em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .label {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .20em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pullquote {
      font-family: var(--serif-zh);
      font-style: italic;
      font-weight: 500;
      font-size: 60px;
      line-height: 1.30;
      color: var(--ink);
      margin: 0;
    }
    .num-mega {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 140px;
      line-height: .95;
      letter-spacing: -.01em;
      color: var(--ink);
      margin: 0;
    }
    .num-xl {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 96px;
      line-height: 1;
      margin: 0;
    }
    .mono { font-family: var(--mono); }

    /* Board-specific scale steps */
    .poster.xhs .h-display { font-size: 116px; }
    .poster.xhs .h-xl      { font-size: 80px; }
    .poster.xhs .num-mega  { font-size: 128px; }

    .poster.square .h-display { font-size: 104px; }
    .poster.square .h-xl      { font-size: 72px; }
    .poster.square .h-md      { font-size: 46px; }
    .poster.square .num-mega  { font-size: 120px; }

    .poster.wide .h-display   { font-size: 124px; }
    .poster.wide .h-xl        { font-size: 88px; }
    .poster.wide .lead        { font-size: 34px; }

    /* ---------- 9. Gold utilities (the signatures) ----------
       R10: gold gradient never covers >=60% of the canvas.
       Use on rules, thin bands, small plates, one focal phrase, badges. */
    .gold-rule {
      height: 3px;
      border: 0;
      width: 100%;
      background: var(--gold-rule);
      margin: 0;
    }
    .gold-rule-thin {
      height: 1px;
      border: 0;
      width: 100%;
      background: linear-gradient(135deg, rgba(122,74,0,.55), rgba(231,159,0,.55));
      margin: 0;
    }
    .gold-text {
      background: var(--gold-rule);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      /* one focal phrase per headline */
    }
    .gold-plate {
      display: inline-block;
      background: var(--accent-deep);
      color: #FBF8F5;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 8px 14px;
      box-shadow: var(--gold-shadow);
    }
    .rule { height: 1px; background: var(--line); border: 0; margin: 24px 0; }
    .rule-accent { height: 3px; background: var(--gold-rule); border: 0; margin: 24px 0; width: 120px; }
    .hr-hairline { height: 1px; background: var(--line); border: 0; margin: 0; }
    .hr-accent { height: 3px; background: var(--gold-rule); border: 0; width: 96px; margin: 0; }

    /* ---------- 10. Layout primitives ---------- */
    .stack    { display: flex; flex-direction: column; }
    .row      { display: flex; flex-direction: row; }
    .gap-3    { gap: var(--sp-3); }
    .gap-4    { gap: var(--sp-4); }
    .gap-5    { gap: var(--sp-5); }
    .gap-6    { gap: var(--sp-6); }
    .gap-7    { gap: var(--sp-7); }
    .gap-8    { gap: var(--sp-8); }
    .gap-9    { gap: var(--sp-9); }
    .gap-10   { gap: var(--sp-10); }
    .grow     { flex: 1; }
    .grid-12  { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--sp-7); }
    .grid-2   { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-9); }
    .grid-3   { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-7); }
    .grid-4   { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-6); }
    .col-2-7-5 { display: grid; grid-template-columns: 7fr 5fr; gap: var(--sp-9); }
    .col-2-8-4 { display: grid; grid-template-columns: 8fr 4fr; gap: var(--sp-9); }
    .span-2   { grid-column: span 2; }
    .span-3   { grid-column: span 3; }
    .span-4   { grid-column: span 4; }
    .span-6   { grid-column: span 6; }
    .span-8   { grid-column: span 8; }
    .span-9   { grid-column: span 9; }
    .span-12  { grid-column: span 12; }
    .center   { text-align: center; }
    .right    { text-align: right; }

    /* ---------- 11. Plates (Warm Gold card fills — pick ONE per grid) ----------
       .plate      — paper-2 + hairline (workhorse)
       .plate-gold — transparent + gold hairline (focal; max one per poster)
       .plate-ink  — ink fill, paper text (one statement plate max)
       Never give a plate a full gold-gradient background (R10). */
    .plate {
      background: var(--paper-2);
      border: 1px solid var(--line);
      padding: var(--sp-8);
    }
    .plate-gold {
      background: transparent;
      border: 1px solid rgba(122,74,0,.40);
      padding: var(--sp-8);
      box-shadow: var(--gold-shadow);
    }
    .plate-ink {
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: var(--sp-8);
    }
    .plate-ink .kicker,
    .plate-ink .meta,
    .plate-ink .lead,
    .plate-ink .body,
    .plate-ink .h-md { color: var(--paper); }

    /* ---------- 12. Image containers (standard ratios) ---------- */
    .frame-img {
      position: relative;
      overflow: hidden;
      background: var(--paper-2);
      display: block;
      margin: 0;
      /* gold hairline frame — Warm Gold signature */
      box-shadow: 0 0 0 1px rgba(122,74,0,.30), var(--gold-shadow);
    }
    .frame-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 50%;
      display: block;
    }
    .frame-img.fit-contain img { object-fit: contain; }
    [data-palette="warm-gold-noir"] .frame-img {
      background: #0F0C08;
      box-shadow: 0 0 0 1px rgba(231,159,0,.22);
    }
    .frame-img.r-3x4   { aspect-ratio: 3 / 4; }
    .frame-img.r-1x1   { aspect-ratio: 1 / 1; }
    .frame-img.r-4x3   { aspect-ratio: 4 / 3; }
    .frame-img.r-16x9  { aspect-ratio: 16 / 9; }
    .frame-img.r-16x10 { aspect-ratio: 16 / 10; }
    .frame-img.r-21x9  { aspect-ratio: 21 / 9; }
    .frame-img.r-3x2   { aspect-ratio: 3 / 2; }
    .img-cap {
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 14px;
    }

    /* ---------- 12b. Screenshot treatment (.frame-shot) ---------- */
    .frame-shot {
      position: relative;
      overflow: hidden;
      display: block;
      margin: 0;
      background: var(--paper-2);
      border-radius: 6px;
      box-shadow: var(--gold-shadow);
    }
    .frame-shot.corners-sq { border-radius: 0; }
    .frame-shot.corners-sm { border-radius: 6px; }
    .frame-shot.corners-md { border-radius: 14px; }

    /* R11: warm-gold or neutral warm-black shadows only — never #000 */
    .frame-shot.shadow-soft { box-shadow: 0 18px 36px -18px rgba(122,74,0,.20), 0 2px 6px rgba(17,9,4,.06); }
    .frame-shot.shadow-ed   { box-shadow: 0 28px 60px -24px rgba(122,74,0,.28), 0 6px 14px rgba(17,9,4,.08), 0 0 0 1px rgba(122,74,0,.25); }
    .frame-shot.shadow-none { box-shadow: none; }

    .frame-shot.bg-paper    { background: var(--paper); }
    .frame-shot.bg-paper-2  { background: var(--paper-2); }
    .frame-shot.bg-ink      { background: var(--ink); }
    .frame-shot.bg-grid     {
      background:
        linear-gradient(var(--paper-2), var(--paper-2)),
        repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 48px);
      background-blend-mode: multiply;
    }
    .frame-shot.bg-dot {
      background-color: var(--paper-2);
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    /* style-c asset backgrounds — pair with matching data-palette */
    .frame-shot.bg-asset-gold-ivory     { background: #F1E9DC url("../../assets/screenshot-backgrounds/style-c/gold-ivory.webp")     center/cover no-repeat; }
    .frame-shot.bg-asset-gold-champagne { background: #F5EADA url("../../assets/screenshot-backgrounds/style-c/gold-champagne.webp") center/cover no-repeat; }
    .frame-shot.bg-asset-gold-bronze    { background: #E5D3B4 url("../../assets/screenshot-backgrounds/style-c/gold-bronze.webp")    center/cover no-repeat; }
    .frame-shot.bg-asset-gold-noir      { background: #17120C url("../../assets/screenshot-backgrounds/style-c/gold-noir.webp")      center/cover no-repeat; }

    .frame-shot.inset-none > img,
    .frame-shot.inset-none > .shot-body { padding: 0; }
    .frame-shot.inset-sub  { padding: 24px; }
    .frame-shot.inset-bal  { padding: 48px; }

    .frame-shot.r-3x4   { aspect-ratio: 3 / 4; }
    .frame-shot.r-1x1   { aspect-ratio: 1 / 1; }
    .frame-shot.r-4x3   { aspect-ratio: 4 / 3; }
    .frame-shot.r-16x9  { aspect-ratio: 16 / 9; }
    .frame-shot.r-16x10 { aspect-ratio: 16 / 10; }
    .frame-shot.r-21x9  { aspect-ratio: 21 / 9; }
    .frame-shot.r-3x2   { aspect-ratio: 3 / 2; }

    .frame-shot > img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      border-radius: inherit;
    }
    .frame-shot.fit-cover > img { object-fit: cover; }

    /* device chrome — CSS-only, no SVG */
    .device-browser {
      position: relative;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--gold-shadow);
    }
    .device-browser::before {
      content: '';
      display: block;
      height: 34px;
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
      background-image:
        radial-gradient(circle at 17px 17px, #f08080 4.5px, transparent 5px),
        radial-gradient(circle at 35px 17px, #f5c450 4.5px, transparent 5px),
        radial-gradient(circle at 53px 17px, #7ec98f 4.5px, transparent 5px);
    }
    .device-browser > .frame-shot,
    .device-browser > img {
      border-radius: 0;
      display: block;
      width: 100%;
      box-shadow: none;
    }
    .device-phone {
      position: relative;
      background: var(--ink);
      border-radius: 32px;
      padding: 13px;
      box-shadow: 0 24px 48px -20px rgba(17,9,4,.40);
    }
    .device-phone > .frame-shot,
    .device-phone > img {
      border-radius: 22px;
      display: block;
      width: 100%;
      box-shadow: none;
    }

    /* ---------- 12c. Map block (.map-block) ---------- */
    .map-block {
      position: relative;
      background: var(--paper-2);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      width: 100%;
      box-shadow: 0 0 0 1px rgba(122,74,0,.22);
    }
    .map-block.r-16x10 { aspect-ratio: 16 / 10; }
    .map-block.r-16x9  { aspect-ratio: 16 / 9; }
    .map-block.r-1x1   { aspect-ratio: 1 / 1; }
    .map-block.r-3x4   { aspect-ratio: 3 / 4; }
    .map-block > img,
    .map-block > svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
    .map-block > img { object-fit: cover; }
    .map-block.tone-paper > img { filter: saturate(.30) sepia(.12) contrast(.94) brightness(1.03); }
    .map-block.tone-ink > img   { filter: saturate(.16) brightness(.58); }
    .map-block > svg .map-coast { fill: none; stroke: var(--line); stroke-width: .4; }
    .map-block > svg .map-road  { fill: none; stroke: var(--muted); stroke-width: .28; stroke-dasharray: 1.2 .8; opacity: .65; }
    .map-block > svg .map-water { fill: var(--paper-2); }
    .map-block > svg .map-grid  { stroke: var(--line); stroke-width: .15; opacity: .55; }

    .map-pin {
      position: absolute;
      width: 0; height: 0;
      transform: translate(-50%, -50%);
    }
    .map-pin .dot {
      position: absolute;
      left: -7px; top: -7px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid var(--paper);
      box-shadow: 0 1px 4px rgba(17,9,4,.32);
    }
    .map-pin.accent .dot { background: var(--accent-deep); }
    .map-pin .line {
      position: absolute;
      left: 8px; top: 0;
      width: 30px; height: 1px;
      background: var(--ink);
      opacity: .5;
    }
    .map-pin.left .line { left: auto; right: 8px; }
    .map-pin .card {
      position: absolute;
      left: 42px; top: -22px;
      min-width: 86px;
      padding: 8px 10px;
      background: rgba(251,248,245,.94);
      box-shadow: 0 0 0 1px var(--line);
      border-radius: 2px;
      white-space: nowrap;
    }
    [data-palette="warm-gold-noir"] .map-pin .card { background: rgba(28,23,17,.94); }
    .map-pin.left .card { left: auto; right: 42px; }
    .map-pin .card .name {
      font-family: var(--serif-zh);
      font-size: 16px;
      line-height: 1.1;
      color: var(--ink);
    }
    .map-pin .card .meta {
      display: block;
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .map-pin.accent .card .name { color: var(--accent-deep); }
    [data-palette="warm-gold-noir"] .map-pin.accent .card .name { color: var(--accent); }

    .map-legend {
      position: absolute;
      left: 14px; bottom: 14px;
      z-index: 3;
      background: rgba(251,248,245,.92);
      padding: 8px 12px;
      box-shadow: 0 0 0 1px var(--line);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    [data-palette="warm-gold-noir"] .map-legend { background: rgba(28,23,17,.92); }
    .map-legend.tr { left: auto; right: 14px; top: 14px; bottom: auto; }

    /* ---------- 13. Warm Gold components (G-recipes) ---------- */

    /* G01 / issue label */
    .issue-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 20px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .issue-row .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-deep);
    }
    .issue-strip {
      position: absolute;
      left: var(--sp-11);
      right: var(--sp-11);
      bottom: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 32px;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }
    .poster.wide .issue-strip { left: var(--sp-13); right: var(--sp-13); }
    .issue-strip span { white-space: nowrap; }

    /* G02 Premium Ledger */
    .ledger { display: flex; flex-direction: column; }
    .ledger-row {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: 24px;
      align-items: baseline;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }
    .ledger-row:last-child { border-bottom: 0; }
    .ledger-row .ledger-nb {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 28px;
      color: var(--accent-deep);
      letter-spacing: .08em;
    }
    [data-palette="warm-gold-noir"] .ledger-row .ledger-nb { color: var(--accent); }
    .ledger-row .ledger-title {
      font-family: var(--serif-zh);
      font-weight: 500;
      font-size: 42px;
      letter-spacing: .01em;
      color: var(--ink);
    }
    .ledger-row .ledger-note {
      font-family: var(--sans-zh);
      font-weight: 400;
      font-size: 24px;
      line-height: 1.55;
      color: rgba(var(--ink-rgb), .74);
    }

    /* G03 Plate Matrix */
    .matrix-fill {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-5);
    }
    .matrix-fill .matrix-cell {
      background: var(--paper-2);
      border: 1px solid var(--line);
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-height: 170px;
    }
    .matrix-fill .matrix-cell .cell-nb {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .12em;
      color: var(--muted);
    }
    .matrix-fill .matrix-cell .cell-title {
      font-family: var(--serif-zh);
      font-weight: 500;
      font-size: 28px;
      line-height: 1.3;
      color: var(--ink);
    }
    /* exactly one focal cell per grid */
    .matrix-fill .matrix-cell.is-gold {
      background: transparent;
      border: 1px solid rgba(122,74,0,.40);
      box-shadow: var(--gold-shadow);
    }
    .matrix-fill .matrix-cell.is-gold .cell-nb { color: var(--accent-deep); }
    .poster.xhs .matrix-fill {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: min-content;
    }
    .poster.xhs .matrix-fill .matrix-cell { min-height: 0; }
    .poster.square .matrix-fill { grid-template-columns: repeat(3, 1fr); }

    .hero-stat-bottom {
      margin-top: var(--sp-7);
      padding-top: var(--sp-6);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: var(--sp-7);
    }

    /* G04 / G06 stat monument + KPI tower */
    .kpi-tower-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-7);
      align-items: end;
      height: 100%;
    }
    .kpi-tower-row .tower-col {
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
      align-items: flex-start;
    }
    .kpi-tower-row .tower-col .num {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 96px;
      line-height: 1;
      margin: 0;
    }
    .kpi-tower-row .tower-col .lbl {
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .kpi-tower-row .tower-col .bar-tower {
      width: 100%;
      height: var(--h, 240px);
      background: rgba(122,74,0,.35);
      transform-origin: bottom;
    }
    /* peak bar carries the gold gradient */
    .kpi-tower-row .tower-col.is-peak .num { color: var(--accent-deep); }
    [data-palette="warm-gold-noir"] .kpi-tower-row .tower-col.is-peak .num { color: var(--accent); }
    .kpi-tower-row .tower-col.is-peak .bar-tower { background: var(--gold-rule); }
    .kpi-tower-row .tower-col.muted .bar-tower { background: var(--line); }
    .poster.xhs .kpi-tower-row,
    .poster.square .kpi-tower-row { grid-template-columns: 1fr 1fr; gap: var(--sp-9); }

    /* G05 Ceremony Split */
    .ceremony-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      height: 100%;
      border: 1px solid var(--line);
    }
    .ceremony-split .cs-col {
      padding: var(--sp-8);
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
    }
    .ceremony-split .cs-col + .cs-col {
      border-left: 1px solid rgba(122,74,0,.40);
    }
    .ceremony-split .cs-col.dark {
      background: var(--ink);
      color: var(--paper);
    }
    .ceremony-split .cs-col.dark .kicker,
    .ceremony-split .cs-col.dark .meta,
    .ceremony-split .cs-col.dark .body,
    .ceremony-split .cs-col.dark .lead,
    .ceremony-split .cs-col.dark .h-md,
    .ceremony-split .cs-col.dark .h-xl,
    .ceremony-split .cs-col.dark .num-mega,
    .ceremony-split .cs-col.dark .num-xl { color: var(--paper); }
    .ceremony-split .cs-col ul {
      margin: 0;
      padding-left: 1.15em;
      font-family: var(--sans-zh);
      font-size: 26px;
      line-height: 1.6;
    }

    /* G07/G12 closing block */
    .closing {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--sp-6);
    }
    .closing .gold-rule { max-width: 240px; }

    /* G10 marginalia */
    .marginalia {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: var(--sp-9);
    }
    .marginalia .mg-col {
      border-left: 1px solid rgba(122,74,0,.40);
      padding-left: 24px;
    }
    .marginalia .mg-col p {
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: .04em;
      color: var(--muted);
      margin: 0 0 16px;
    }

    /* G09 checklist rows */
    .checklist { display: flex; flex-direction: column; }
    .check-row {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 24px;
      align-items: baseline;
      padding: 26px 0;
      border-bottom: 1px solid rgba(122,74,0,.35);
    }
    .check-row:last-child { border-bottom: 0; }
    .check-row .check-nb {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 26px;
      color: var(--accent-deep);
    }
    [data-palette="warm-gold-noir"] .check-row .check-nb { color: var(--accent); }
    .check-row .check-title {
      font-family: var(--serif-zh);
      font-weight: 500;
      font-size: 38px;
      color: var(--ink);
      margin: 0 0 6px;
    }
    .check-row .check-note {
      font-family: var(--sans-zh);
      font-size: 24px;
      line-height: 1.5;
      color: rgba(var(--ink-rgb), .74);
      margin: 0;
    }

    /* ---------- 14. Pair preview frame ---------- */
    .pair-preview {
      width: 2400px;
      min-height: 1180px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      padding: var(--sp-9);
      display: grid;
      grid-template-columns: 2100px 1080px;
      grid-template-rows: 900px 1080px;
      gap: var(--sp-9);
      align-content: center;
      justify-content: center;
    }
    .pair-preview .preview-wide   { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
    .pair-preview .preview-square { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .pair-preview .preview-label {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: var(--sp-5);
    }

    /* ---------- 15. Corner metadata helpers ---------- */
    .poster .corner-tl,
    .poster .corner-tr,
    .poster .corner-bl,
    .poster .corner-br {
      position: absolute;
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 3;
    }
    .poster.xhs .corner-tl,
    .poster.square .corner-tl { left: var(--sp-11); top: 56px; }
    .poster.xhs .corner-tr,
    .poster.square .corner-tr { right: var(--sp-11); top: 56px; }
    .poster.xhs .corner-bl,
    .poster.square .corner-bl { left: var(--sp-11); bottom: 56px; }
    .poster.xhs .corner-br,
    .poster.square .corner-br { right: var(--sp-11); bottom: 56px; }
    .poster.wide .corner-tl { left: var(--sp-13); top: 56px; }
    .poster.wide .corner-tr { right: var(--sp-13); top: 56px; }
    .poster.wide .corner-bl { left: var(--sp-13); bottom: 56px; }
    .poster.wide .corner-br { right: var(--sp-13); bottom: 56px; }
  </style>
</head>
<body>
  <!-- PALETTE_OVERRIDE
       Change <html data-system="warm-gold" data-palette="…"> above to:
       warm-gold-classic | warm-gold-champagne | warm-gold-bronze
       | warm-gold-rose | warm-gold-espresso | warm-gold-noir
       One deck — one palette. Never combine.
       data-system must stay "warm-gold" (validator probes it first).
  -->
  <main class="sheet">

    <!-- POSTERS_HERE -->
    <!--
      Replace the placeholder poster below with real content.
      Each poster carries one Layout Recipe (G01-G12) from
      references/layout-recipes.md.

      Available board sizes:
        <section class="poster xhs"    id="xhs-01">…</section>   3:4
        <section class="poster square" id="wechat-1x1">…</section> 1:1
        <section class="poster wide"   id="wechat-21x9">…</section> 21:9

      For WeChat covers, also include a <section class="pair-preview">
      that places the 21:9 + 1:1 side-by-side for review.

      Hard rules every poster must honor:
        - data-system="warm-gold" + exactly one data-palette
        - serif titles + sans body + mono meta (mixed typography)
        - at least one gold signature per page (rule / glow / shadow / hairline)
        - gold gradient never covers >=60% of the canvas (R10)
        - shadows: rgba(122,74,0,…) or rgba(17,9,4,…) only (R11)
        - plate / plate-gold / plate-ink are mutually exclusive per grid
        - one .plate-gold (or .is-gold) cell max per poster
        - one .gold-text phrase max per headline
    -->

    <!-- ============================================================
         Placeholder: G01 Gilded Cover (3:4)
         Replace with real cover content from layout-recipes.md.
         ============================================================ -->
    <section class="poster xhs" id="xhs-01">
      <div class="grain"></div>
      <div class="gold-glow" style="--gx: 72%; --gy: 16%"></div>
      <div class="content stack gap-7">
        <div class="issue-row">
          <span>Vol. 01</span><span class="dot"></span><span>2026.07</span>
        </div>
        <div class="stack gap-5">
          <p class="kicker">封面 · Gilded Cover</p>
          <h1 class="h-display">替换为<br><span class="gold-text">真实标题</span></h1>
          <div class="gold-rule" style="width: 200px"></div>
          <p class="h-sub">A working subtitle</p>
        </div>
        <figure class="frame-img r-16x10">
          <img src="assets/cover.jpg" alt="cover image placeholder">
        </figure>
        <p class="lead">用一句克制的引语解释为什么这一组卡片值得读完。正文使用无衬线，标题使用衬线。</p>
      </div>
      <div class="issue-strip">
        <span>Issue · Warm Gold</span>
        <span>—</span>
        <span>by [作者]</span>
      </div>
    </section>

  </main>

  <!-- Lucide icon initialization (used by ledger / checklist accents) -->
  <script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
